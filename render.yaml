# Render.com blueprint — sovereign-grid web service + (optional) fresh DB.
# The live service (sovereign-grid-zzxu) was created via API on 2026-09-25
# pointing at the existing DB — this file documents the equivalent definition.
# NOTE: DATABASE_URL here references a blueprint database; the live service
# instead points at the current DB's URL via env var (see rotate_render_db.sh).
services:
  - type: web
    name: sovereign-grid
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
